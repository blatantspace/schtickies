<!DOCTYPE html>
<html>
<head>
    <title>Notes Schticky</title>
    <style>
        @font-face {
            font-family: 'DANK MONO';
            src: url('fonts/DankMono-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'DANK MONO';
            src: url('fonts/DankMono-Italic.otf') format('opentype');
            font-weight: normal;
            font-style: italic;
        }

        @font-face {
            font-family: 'DANK MONO';
            src: url('fonts/DankMono-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'DANK MONO', monospace;
            background-color: #FFF9C4; /* Pastel yellow */
            color: #333;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .draggable-area {
            -webkit-app-region: drag;
            height: 30px;
            background-color: rgba(255, 249, 196, 0.8);
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        #editor {
            width: 100%;
            height: calc(100% - 30px);
            border: none;
            background: transparent;
            resize: none;
            font-family: 'DANK MONO', monospace;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            padding: 20px;
            box-sizing: border-box;
        }

        .window-controls {
            margin-left: auto;
            display: flex;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .window-control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
        }

        .close { background-color: #FF6B6B; }
        .minimize { background-color: #FFD93D; }
        .maximize { background-color: #6BCB77; }
    </style>
</head>
<body>
    <div class="draggable-area">
        <span id="note-title" style="font-size: 12px; color: rgba(0, 0, 0, 0.7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px;">Untitled</span>
        <div class="window-controls">
            <div class="window-control minimize"></div>
            <div class="window-control maximize"></div>
            <div class="window-control close"></div>
        </div>
    </div>
    <textarea id="editor" placeholder="Type your notes here..."></textarea>
    <script src="renderer.js"></script>
</body>
</html>
